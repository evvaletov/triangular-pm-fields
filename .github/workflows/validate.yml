name: Open-tool conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: '1.12.6'
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libgmp-dev libboost-dev cmake
          python -m pip install -r requirements-tested.txt
          python -m pip install .
      - name: Build, execute, and compare
        run: bash tools/ci.sh
