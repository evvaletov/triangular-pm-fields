[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "triangular-pm-fields"
version = "0.1.0"
description = "Charged triangular surface fields and normalized Taylor coefficients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "mpmath>=1.3"]
authors = [{name = "Eremey Valetov"}]
license = {text = "No public license grant. See LICENSE."}

[tool.setuptools.packages.find]
where = ["python"]
